# APP 与 TOOL 是两个独立菜单区；二者都可以使用映射创建多层分类。
# launch 是安全启动白名单，action 是程序内置工具标识。
menus:
  APP:
    计算器:
      launch:
        - calc.exe
        - /System/Applications/Calculator.app
        - /Applications/Calculator.app
        - gnome-calculator
        - kcalc
    记事本:
      launch:
        - notepad.exe
        - /System/Applications/TextEdit.app
        - /Applications/TextEdit.app
        - gedit
        - kate
        - xed
    终端:
      launch:
        - C:\WINDOWS\system32\cmd.exe
        - /System/Applications/Utilities/Terminal.app
        - /Applications/Utilities/Terminal.app
        - x-terminal-emulator
        - gnome-terminal
        - konsole
    网易云:
      launch:
        - cloudmusic.exe
        - C:\Program Files (x86)\Netease\CloudMusic\cloudmusic.exe
        - C:\Program Files\Netease\CloudMusic\cloudmusic.exe
        - D:\Program Files (x86)\Netease\CloudMusic\cloudmusic.exe
        - C:\Netease\CloudMusic\cloudmusic.exe
        - /Applications/NeteaseMusic.app
        - /Applications/NetEaseMusic.app
        - /Applications/网易云音乐.app
        - netease-cloud-music
    GAME:
      Steam:
        launch:
          - C:\Program Files (x86)\Steam\steam.exe
          - C:\Program Files\Steam\steam.exe
          - E:\steam\steam.exe
          - /Applications/Steam.app
          - steam
      鹰角启动:
        launch:
          - E:\GAME\Hypergryph Launcher\Launcher.exe
          - C:\Program Files (x86)\Hypergryph Launcher\Launcher.exe
          - C:\Program Files\Hypergryph Launcher\Launcher.exe
          - /Applications/明日方舟.app

  TOOL:
    系统工具:
      截图:
        action: screenshot
      控制移动:
        action: keyboard_control
    开发工具:
      Codex进程:
        action: codex_status
    网络工具:
      VPN:
        launch:
          - D:\others\TOOLS\V2\v2rayN\v2rayN.exe
