# 桌宠动作配置
# fall_mode: smooth=缓降飘落，direct=快速直落，none=不下坠
# idle_mode: default=默认，sport=运动，lazy=懒惰

base_dir: resource/wisdel/皮肤素材/可用素材
fall_mode: smooth
idle_mode: default
smooth_fall: true

actions:
  idle: relax.gif
  interact: interact.gif
  special: special0.gif, special1.gif, jump.gif
  move: move.gif
  sweat: sweat.gif
  fly: fly.gif
  sit: sit.gif
  sleep: sleep.gif
  screenshot: sit.gif
  open_app: special.gif
  start: start.gif
  hide: hide.gif
  die: die.gif

loops:
  idle: true
  interact: false
  special: false
  move: true
  sweat: true
  fly: true
  sit: true
  sleep: true
  screenshot: false
  open_app: false
  start: false
  hide: true
  die: false
